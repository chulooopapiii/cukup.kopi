name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Siapkan folder
        run: |
          mkdir -p www assets
          [ -f index.html ] && mv index.html www/index.html || true
          for f in icon-only icon-foreground icon-background; do [ -f $f.png ] && mv $f.png assets/$f.png || true; done
      - run: npm install
      - run: npx cap add android
      - name: Ikon logo
        run: |
          if [ -f assets/icon-only.png ]; then
            npm install --save-dev @capacitor/assets
            npx capacitor-assets generate --android --iconBackgroundColor "#34190F"
          fi
      - name: Izin notifikasi
        run: sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cukup-kopi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
